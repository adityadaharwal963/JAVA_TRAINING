<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping cart</title>
</head>
<body>
<h2 id="welcomeMessage"></h2>
<form id="shoppingForm" action="/CalculateServlet" method="post">
  <table>
    <tr>
      <td>Sr no</td>
      <td>Item</td>
      <td>Price</td>
      <td>Quantity</td>
      <td>Buy</td>
    </tr>
    <tr>
      <td>1</td>
      <td>Dell</td>
      <td>50000</td>
      <td><input type="text" name="quantity-dell" ></td>
      <td><input type="checkbox" name="dell" value="false"></td>
    </tr>
    <tr>
      <td>2</td>
      <td>HP</td>
      <td>70000</td>
      <td><input type="text" name="quantity-hp" ></td>
      <td><input type="checkbox" name="hp" value="false"></td>
    </tr>
    <tr>
      <td>3</td>
      <td>MAC</td>
      <td>150000</td>
      <td><input type="text" name="quantity-mac" ></td>
      <td><input type="checkbox" name="mac" value="false"></td>
    </tr>
    <tr>
      <td>4</td>
      <td>Lenovo</td>
      <td>65000</td>
      <td><input type="text" name="quantity-lenovo" ></td>
      <td><input type="checkbox" name="lenovo" value="false"></td>
    </tr>
  </table>
  <input type="submit" value="Buy">
</form>
</body>
</html>
